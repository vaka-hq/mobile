buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'app.vaka.ui'
version = '0.1.0'

// Expo Modules 2.0 for the functions (VakaUIModule); the views stay on the definition DSL, as
// Expo UI's do (VakaViewsModule, listed in expo-module.config.json).
expoModule {
  v2 true
}

android {
  namespace "app.vaka.ui"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Coil 3.4 is the newest whose Kotlin standard library (2.3) React Native 0.88's Kotlin 2.2
  // compiler can read; 3.5 and later need Kotlin 2.4.
  implementation 'io.coil-kt.coil3:coil-compose:3.4.0'
  implementation 'io.coil-kt.coil3:coil-network-okhttp:3.4.0'
  // Predictive back attaches and dismisses stack screens (StackBack.kt), with the back events
  // androidx.activity 1.8 brought; the app itself runs 1.10.
  implementation project(':react-native-screens')
  implementation 'androidx.activity:activity:1.10.1'
  implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'

  if (findProject(':expo-ui') != null) {
    implementation project(':expo-ui')
  } else {
    def expoUiPackageJson = rootProject.file('../node_modules/@expo/ui/package.json')
    if (!expoUiPackageJson.exists()) {
      throw new GradleException('Unable to resolve the installed @expo/ui version')
    }
    def expoUiVersion = new groovy.json.JsonSlurper().parse(expoUiPackageJson).version
    implementation "expo.modules.ui:expo.modules.ui:${expoUiVersion}"
  }
  // Match the Compose and Material 3 versions that @expo/ui is built against.
  implementation 'androidx.compose.animation:animation-android:1.12.1'
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.compose.material3:material3:1.5.0-beta01'
  implementation 'androidx.compose.material3:material3-android:1.5.0-beta01'
}
